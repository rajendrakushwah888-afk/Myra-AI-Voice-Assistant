name: Build and Release MYRA APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build APKs with Gradle
        run: ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: myra-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: myra-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "MYRA AI Voice Assistant - Latest APK Build"
          body: |
            ## 🚀 MYRA AI Voice Assistant - Latest Build
            
            Compiled automatically with Android Gradle Plugin & Java 17.
            
            ### 📱 Download APKs:
            - **Debug APK (Recommended for Testing)**: Download `app-debug.apk` below
            - **Release APK**: Download `app-release.apk` below
            
            ### ✨ Features:
            - Gemini 2.0 Flash Multimodal Live Voice
            - Voice Recognition & Siri-style Wake Word
            - Phone Call & Accessibility Integration
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
